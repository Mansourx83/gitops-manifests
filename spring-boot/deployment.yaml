apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app
  namespace: apps
  labels:
    app: spring-boot-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-app
  template:
    metadata:
      labels:
        app: spring-boot-app
    spec:
      containers:
      - name: spring-boot-app
        image: mansour19/spring-boot-demo:30
        ports:
        - containerPort: 8080
