apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootstrap-app
  namespace: jenkins
  labels:
    app: bootstrap-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bootstrap-app
  template:
    metadata:
      labels:
        app: bootstrap-app
    spec:
      containers:
      - name: bootstrap-app
        image: mansour19/bootstrap-app:3a45c0185a1f7cdf2d0eba6328f6007083de7e3e
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
